name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # 关键：固定 debug 证书，否则每次构建签名都不同，装不上只能卸载重装
      - name: 固定签名证书
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > "$HOME/.android/debug.keystore"
            echo "→ 使用 Secrets 中的证书"
          else
            cp signing/debug.keystore "$HOME/.android/debug.keystore"
            echo "→ 使用仓库内置证书 signing/debug.keystore"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | head -8
          echo "证书 SHA-256 指纹："
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            | grep -i "SHA256:" | head -1

      - name: 安装依赖
        run: npm install

      - name: 添加安卓平台
        run: npx cap add android

      - name: 套用自适应图标
        run: |
          cp -r resources/android/res/. android/app/src/main/res/
          # 删掉 Capacitor 模板残留的小尺寸旧图标，避免低密度设备回退到默认图标
          rm -f android/app/src/main/res/mipmap-mdpi/ic_launcher*.png \
                android/app/src/main/res/mipmap-hdpi/ic_launcher*.png \
                android/app/src/main/res/mipmap-xhdpi/ic_launcher*.png
          echo "图标已套用"

      - name: 校验图标已覆盖
        run: |
          echo "--- 目标目录内容 ---"
          ls -l android/app/src/main/res/mipmap-xxxhdpi/ android/app/src/main/res/mipmap-xxhdpi/ android/app/src/main/res/mipmap-anydpi-v26/
          echo "--- 自适应图标声明 ---"
          cat android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo "--- 清单里的图标引用 ---"
          grep -o 'android:icon="[^"]*"' android/app/src/main/AndroidManifest.xml

      - name: 启用 edge-to-edge（网页铺到系统栏底下，系统栏全透明）
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          echo "MainActivity: $MAIN"
          python3 - "$MAIN" <<'PY'
          import re, sys
          p = sys.argv[1]
          src = open(p).read()
          pkg = re.search(r'^package\s+([\w.]+);', src, re.M).group(1)
          java = '''package %s;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(Color.TRANSPARENT);
                  if (Build.VERSION.SDK_INT >= 29) {
                      getWindow().setStatusBarContrastEnforced(false);
                      getWindow().setNavigationBarContrastEnforced(false);
                  }
                  WindowInsetsControllerCompat ic =
                          WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  ic.setAppearanceLightStatusBars(true);
                  ic.setAppearanceLightNavigationBars(true);
                  getWindow().getDecorView().post(new Runnable() {
                      public void run() {
                          try {
                              getBridge().getWebView().setVerticalScrollBarEnabled(false);
                              getBridge().getWebView().setScrollbarFadingEnabled(true);
                          } catch (Exception e) {}
                      }
                  });
              }
          }
          ''' % pkg
          open(p, 'w').write(java)
          print("patched ->", p)
          print(java)
          PY
          cat "$MAIN"

      - name: 写死 debug 签名（AGP 默认路径可能不是我们放的 keystore）
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          // ---- 固定 debug 签名，避免每次构建证书不同 ----
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv("HOME") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE
          tail -20 android/app/build.gradle

      - name: 同步网页资源
        run: npx cap sync

      - name: 编译 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 打印 APK 实际签名证书
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          unzip -p "$APK" META-INF/*.RSA > /tmp/cert.rsa 2>/dev/null || true
          if [ -s /tmp/cert.rsa ]; then
            keytool -printcert -file /tmp/cert.rsa | grep -i "SHA256:" | head -1
          else
            echo "没有 v1 签名证书，看下面的 apksigner 输出"
          fi
      - name: 核对 APK 里打进去的图标
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -i "mipmap" || echo "（没有找到 mipmap 资源，可能是资源被重命名了）"

      - name: 校验 APK 签名
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -6

      - name: 上传 APK
        uses: actions/upload-artifact@v5
        with:
          name: 12周计划-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
